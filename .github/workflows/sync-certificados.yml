name: Sync certificates from Certificados repo

on:
  repository_dispatch:
    types: [certificados-updated]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch and regenerate certificate data
        run: node scripts/sync-certificados.mjs

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/assets/certificados src/data/certificados.ts
          if git diff --cached --quiet; then
            echo "Nenhuma mudança nos certificados."
          else
            git commit -m "chore: sincronizar certificados a partir do repo Certificados"
            git push
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-and-deploy:
    needs: sync
    uses: ./.github/workflows/build-deploy.yml
    with:
      ref: ${{ needs.sync.outputs.sha }}
